name: Build TokNova Core

on:
  push:
    branches: [toknova-clean-v0.1.0]
    paths:
      - 'toknova-core/**'
      - '.github/workflows/toknova-core.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: toknova-clean-v0.1.0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Compile TokNova Core
        shell: bash
        run: |
          set -euxo pipefail
          ANDROID_JAR="$ANDROID_HOME/platforms/android-35/android.jar"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          rm -rf toknova-core/build
          mkdir -p toknova-core/build/stub-classes toknova-core/build/classes toknova-core/build/dex

          javac -source 8 -target 8 -cp "$ANDROID_JAR" \
            -d toknova-core/build/stub-classes \
            toknova-core/stubs/com/ss/android/ugc/aweme/app/host/AwemeHostApplication.java
          jar cf toknova-core/build/tiktok-stubs.jar -C toknova-core/build/stub-classes .

          javac -source 8 -target 8 \
            -cp "$ANDROID_JAR:toknova-core/build/tiktok-stubs.jar" \
            -d toknova-core/build/classes \
            $(find toknova-core/src -name '*.java' -print)

          "$BUILD_TOOLS/d8" \
            --min-api 23 \
            --lib "$ANDROID_JAR" \
            --classpath toknova-core/build/tiktok-stubs.jar \
            --output toknova-core/build/dex \
            $(find toknova-core/build/classes -name '*.class' -print)

          test -s toknova-core/build/dex/classes.dex
          mkdir -p toknova-core/artifacts
          base64 -w0 toknova-core/build/dex/classes.dex > toknova-core/artifacts/classes.dex.b64
          sha256sum toknova-core/build/dex/classes.dex > toknova-core/artifacts/classes.dex.sha256
          printf 'TokNova Core 0.1.0\n' > toknova-core/artifacts/version.txt

      - name: Commit compiled DEX artifact
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add toknova-core/artifacts
          if git diff --cached --quiet; then
            echo 'Artifact unchanged'
            exit 0
          fi
          git commit -m 'Build TokNova Core 0.1.0 DEX'
          git push origin HEAD:toknova-clean-v0.1.0
